<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 592" width="560" height="592" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
<rect width="560" height="592" rx="14" fill="#faf9f5"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15233f"/></marker></defs>
<g transform="translate(20,18)" fill="none" stroke="#15233f" stroke-width="1.4" text-anchor="middle">
<text x="130" y="30" font-size="22" font-weight="700" stroke="none" fill="#15233f">大祓词</text>
<text x="390" y="30" font-size="22" font-weight="700" stroke="none" fill="#15233f">飛ばし</text>
<rect x="10" y="52" width="240" height="74" rx="6"/>
<text x="130" y="85" font-size="22" stroke="none" fill="#15233f">罪</text><text x="130" y="111" font-size="16" stroke="none" fill="#4a556b">从山顶顺急流</text>
<path d="M130 128V153" marker-end="url(#a)"/>
<rect x="10" y="156" width="240" height="74" rx="6"/>
<text x="130" y="189" font-size="22" stroke="none" fill="#15233f">濑织津比卖</text><text x="130" y="215" font-size="16" stroke="none" fill="#4a556b">带进大海</text>
<path d="M130 232V257" marker-end="url(#a)"/>
<rect x="10" y="260" width="240" height="74" rx="6"/>
<text x="130" y="293" font-size="22" stroke="none" fill="#15233f">速开都比卖</text><text x="130" y="319" font-size="16" stroke="none" fill="#4a556b">在潮汇处咽下</text>
<path d="M130 336V361" marker-end="url(#a)"/>
<rect x="10" y="364" width="240" height="74" rx="6"/>
<text x="130" y="397" font-size="22" stroke="none" fill="#15233f">气吹户主</text><text x="130" y="423" font-size="16" stroke="none" fill="#4a556b">吹进根之国</text>
<path d="M130 440V465" marker-end="url(#a)"/>
<rect x="10" y="468" width="240" height="74" rx="6" stroke-dasharray="5 5"/>
<text x="130" y="501" font-size="22" stroke="none" fill="#15233f">速佐须良比卖</text><text x="130" y="527" font-size="16" stroke="none" fill="#4a556b">流浪、弄丢</text>
<rect x="270" y="52" width="240" height="74" rx="6"/>
<text x="390" y="85" font-size="22" stroke="none" fill="#15233f">亏损</text><text x="390" y="111" font-size="16" stroke="none" fill="#4a556b">母公司账上</text>
<path d="M390 128V153" marker-end="url(#a)"/>
<rect x="270" y="156" width="240" height="74" rx="6"/>
<text x="390" y="189" font-size="22" stroke="none" fill="#15233f">子公司</text><text x="390" y="215" font-size="16" stroke="none" fill="#4a556b">挪出去</text>
<path d="M390 232V257" marker-end="url(#a)"/>
<rect x="270" y="260" width="240" height="74" rx="6"/>
<text x="390" y="293" font-size="22" stroke="none" fill="#15233f">账外</text><text x="390" y="319" font-size="16" stroke="none" fill="#4a556b">不进报表</text>
<path d="M390 336V361" marker-end="url(#a)"/>
<rect x="270" y="364" width="240" height="74" rx="6"/>
<text x="390" y="397" font-size="22" stroke="none" fill="#15233f">再转手</text><text x="390" y="423" font-size="16" stroke="none" fill="#4a556b">一道又一道</text>
<path d="M390 440V465" marker-end="url(#a)"/>
<rect x="270" y="468" width="240" height="74" rx="6" stroke-dasharray="5 5"/>
<text x="390" y="501" font-size="22" stroke="none" fill="#15233f">不知去向</text><text x="390" y="527" font-size="16" stroke="none" fill="#4a556b">没有人认</text>
</g>
</svg>
